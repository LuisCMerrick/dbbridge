name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Vet (linux, windows) & test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'
      - name: Module checks
        run: |
          go mod verify
          go mod tidy -diff
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: go test
        run: go test ./... -count=1 -timeout=300s
      - name: go test -race
        run: go test -race ./... -count=1 -timeout=600s
      - name: Sample configurations
        run: |
          export DBB_TOKEN_TO_HQ=configuration-check-current
          export DBB_TOKEN_FROM_PLANT_CURRENT=configuration-check-current
          for config_path in configs/*.yaml; do
            go run ./cmd/dbbridge check-config --config "$config_path"
          done
          for config_path in configs/production/peer-*.yaml; do
            go run ./cmd/dbbridge check-config --offline --config "$config_path"
          done

  windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'
      - name: go test (service, file ACLs, CLI, config)
        run: go test ./internal/service/... ./internal/fileutil/... ./cmd/... ./internal/config/... -count=1 -timeout=300s
