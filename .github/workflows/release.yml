name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default; only the publishing job below gets write access.
permissions:
  contents: read

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The build hashes the source tree; no git history is needed.
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Run Tests & Verification
        run: |
          go mod download
          bash scripts/verify.sh

      - name: Build Release Binaries
        run: |
          release_tag="${GITHUB_REF_NAME:-manual}"
          if [[ "$release_tag" =~ ^v[0-9] ]]; then
            release_version="${release_tag#v}"
          else
            release_version="1.5.$(date -u +%y.%m.%d)"
          fi
          # Reproducible builds: the build date and archive timestamps are
          # the commit time, not the wall clock.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            DBB_VERSION="$release_version" DBB_COMMIT="$GITHUB_SHA" \
            TZ=UTC bash scripts/build-release.sh dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbbridge-binaries
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dbbridge-binaries
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: Release ${{ github.ref_name }}
          # Tags with a pre-release suffix (v1.5.0-rc1) are published as
          # pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/dbbridge-*
            dist/BUILD-INFO.txt
            dist/SHA256SUMS
          generate_release_notes: true
